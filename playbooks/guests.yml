---
- name: Prepare cloud images
  hosts: proxmox
  gather_facts: false
  roles:
    - role: proxmox_cloud_images
      tags: [images]

# Creates VMs through the API token; nothing connects to the VMs themselves.
- name: Provision VMs
  hosts: proxmox_vms
  gather_facts: false
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_name }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      # The host uses the self-signed certificate from the Proxmox installer.
      validate_certs: false
  roles:
    - role: proxmox_vm
      tags: [vms]

# Connects to the VMs over SSH as the cloud-init user. proxmox_vm_address runs with every tag so a
# partial run still knows the address.
- name: Configure VMs
  hosts: proxmox_vms
  gather_facts: false
  become: true
  roles:
    - role: proxmox_vm_address
      tags: [always]
    - role: qemu_guest_agent
      tags: [guest_agent]

- name: Fetch k3s kubeconfig
  hosts: k3s
  gather_facts: false
  become: true
  roles:
    - role: proxmox_vm_address
      tags: [always]
    - role: k3s_kubeconfig
      tags: [kubeconfig]

# Talks to the Cloudflare API and to the cluster through KUBECONFIG from the control node; nothing
# connects to the VM. cloudflare_access and k3s_secrets need the account and tunnel token from
# cloudflare_tunnel; argocd needs the repository Secret from k3s_secrets.
- name: Publish k3s
  hosts: k3s
  gather_facts: false
  roles:
    - role: cloudflare_tunnel
      tags: [tunnel]
    - role: cloudflare_access
      tags: [access]
    - role: k3s_secrets
      tags: [secrets]
    - role: argocd
      tags: [argocd]
