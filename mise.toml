[tools]
python = "3.13"
uv = "latest"
just = "latest"
# Keep within one minor version of k3s_version (group_vars/k3s).
kubectl = "1.36"
# Used by the argocd role through kubernetes.core.helm.
helm = "4"

[env]
_.python.venv = { path = ".venv", create = true }
# Executable, so Ansible runs it and reads the password from stdout (fetched from Bitwarden).
ANSIBLE_VAULT_PASSWORD_FILE = "{{ config_root }}/scripts/vault-pass"
# Written by `just kubeconfig`.
KUBECONFIG = "{{ env.HOME }}/.config/local-iac/kubeconfig"
