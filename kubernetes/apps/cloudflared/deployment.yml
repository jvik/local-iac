---
# Remotely managed tunnel: public hostnames are configured on the tunnel in the Cloudflare dashboard
# and point at Traefik, which routes by Host header to the Ingresses. The token Secret is created by
# the k3s_secrets role, not by this Kustomization.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  # Each replica opens its own connections to Cloudflare, so a rollout does not drop the tunnel.
  replicas: 2
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          # /ready returns 200 once the replica has a connection to Cloudflare.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
