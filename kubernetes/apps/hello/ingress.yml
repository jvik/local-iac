---
# Traefik listens on ports 80 and 443 of the node through ServiceLB. Public through the Cloudflare
# Tunnel (kubernetes/apps/cloudflared); on the LAN, send the Host header with curl --resolve.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
spec:
  ingressClassName: traefik
  rules:
    - host: hello.bitbu.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  name: http
