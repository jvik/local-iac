---
# Runs on the control node against the cluster in KUBECONFIG. Installs Argo CD with Helm and
# creates the ApplicationSet that deploys the workloads repository. The repository credential is a
# Secret created by k3s_secrets; Argo CD finds it by its label.

- name: Check Argo CD settings
  ansible.builtin.assert:
    that:
      - argocd_hostname | length > 0
      - argocd_workloads_repo_url | length > 0
    fail_msg: Set argocd_hostname and argocd_workloads_repo_url in group_vars/k3s.
    quiet: true

- name: Install Argo CD
  delegate_to: localhost
  run_once: true
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    wait: true
    values:
      global:
        domain: "{{ argocd_hostname }}"
      configs:
        params:
          server.insecure: true
      server:
        ingress:
          enabled: true
          ingressClassName: traefik
      # Login is the local admin user behind Cloudflare Access; no SSO.
      dex:
        enabled: false

# Argo CD fills in {{ .path.* }} itself, so those strings are kept from Ansible with raw blocks.
- name: Create workloads ApplicationSet
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: workloads
        namespace: "{{ argocd_namespace }}"
      spec:
        goTemplate: true
        goTemplateOptions: [missingkey=error]
        generators:
          - git:
              repoURL: "{{ argocd_workloads_repo_url }}"
              revision: "{{ argocd_workloads_revision }}"
              directories:
                - path: "{{ argocd_workloads_path }}/*"
        template:
          metadata:
            name: "{% raw %}{{ .path.basename }}{% endraw %}"
          spec:
            project: default
            source:
              repoURL: "{{ argocd_workloads_repo_url }}"
              targetRevision: "{{ argocd_workloads_revision }}"
              path: "{% raw %}{{ .path.path }}{% endraw %}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{% raw %}{{ .path.basename }}{% endraw %}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
