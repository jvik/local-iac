---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: proxmox_updates_unattended

- name: Enable the daily apt timers
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      {{ ansible_managed | comment }}
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when: proxmox_updates_unattended

- name: Install unattended-upgrades config
  ansible.builtin.template:
    src: 52local-iac-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52local-iac-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  when: proxmox_updates_unattended

- name: Remove managed apt config when unattended upgrades are disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/20auto-upgrades
    - /etc/apt/apt.conf.d/52local-iac-unattended-upgrades
  when: not proxmox_updates_unattended
