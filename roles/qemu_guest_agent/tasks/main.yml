---
# Cloud-init also installs the agent on the first boot, which lets proxmox_vm_address find the VM's
# address before Ansible can reach it. This role keeps it installed and running afterwards.

- name: Wait for SSH
  ansible.builtin.wait_for_connection:
    timeout: 600

# Avoids competing with cloud-init's own package installs for the apt lock.
- name: Wait for cloud-init to finish
  ansible.builtin.command:
    argv: [cloud-init, status, --wait]
  changed_when: false
  check_mode: false

- name: Install QEMU guest agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started
