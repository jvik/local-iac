---
# Single-node k3s server for homelab workloads, installed by cloud-init on the first boot with the
# bundled Traefik, ServiceLB and local-path storage.
k3s_version: v1.36.5+k3s1

# Argo CD deploys every directory under apps/ in the workloads repository.
argocd_hostname: argocd.bitbu.dev
argocd_workloads_repo_url: git@github.com:jvik/homelab-workloads.git

# Grafana of the observability stack (apps/observability in the workloads repository).
grafana_hostname: grafana.bitbu.dev

# Public hostnames, served through a Cloudflare Tunnel to Traefik. Each needs an Ingress with the
# same host, in the workloads repository or kubernetes/apps.
cloudflare_tunnel_api_token: "{{ vault_cloudflare_api_token }}"
cloudflare_tunnel_zone: bitbu.dev
cloudflare_tunnel_hostnames:
  - hello.bitbu.dev
  - "{{ argocd_hostname }}"
  - "{{ grafana_hostname }}"

# Hostnames that require a Cloudflare Access login first, and who may log in.
cloudflare_access_api_token: "{{ vault_cloudflare_api_token }}"
cloudflare_access_hostnames:
  - "{{ argocd_hostname }}"
  - "{{ grafana_hostname }}"
cloudflare_access_emails: ["neat.bus1499@bitbu.no"]

# Created by the k3s_secrets role; manifests reference them by name.
k3s_secrets:
  - name: cloudflared
    namespace: cloudflared
    data:
      # Read from the Cloudflare API by the cloudflare_tunnel role.
      token: "{{ cloudflare_tunnel_token }}"
  # Read-only deploy key for the workloads repository. Argo CD picks up repository Secrets by label.
  - name: workloads-repo
    namespace: argocd
    labels:
      argocd.argoproj.io/secret-type: repository
    data:
      type: git
      url: "{{ argocd_workloads_repo_url }}"
      sshPrivateKey: "{{ vault_argocd_workloads_ssh_key }}"
  # Grafana's local admin login, behind Cloudflare Access.
  - name: grafana-admin
    namespace: observability
    data:
      admin-user: admin
      admin-password: "{{ vault_grafana_admin_password }}"

proxmox_vm_image: ubuntu-26.04
proxmox_vm_cores: 4
proxmox_vm_memory: 8192
proxmox_vm_disk_size: 100G
# Every local-path PersistentVolume, including metrics and logs, mounted at
# /var/lib/rancher/k3s/storage below. A full volume then cannot fill the root filesystem.
proxmox_vm_data_disk_size: 300G
proxmox_vm_tags: [k3s]

proxmox_vm_vendor_data:
  # Runs before runcmd, so the volume directory is mounted before k3s is installed. Whole disk, no
  # partition table, so growing proxmox_vm_data_disk_size only needs resize2fs in the VM.
  fs_setup:
    - label: k3s-data
      filesystem: ext4
      device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
      partition: none
  # nofail keeps the VM bootable (and reachable over SSH) without the disk; required-by keeps k3s
  # from starting and writing volumes to the root filesystem instead.
  mounts:
    - - LABEL=k3s-data
      - /var/lib/rancher/k3s/storage
      - ext4
      - defaults,nofail,x-systemd.required-by=k3s.service
      - "0"
      - "2"
  packages:
    - qemu-guest-agent
    # Needed by Longhorn and NFS volumes, if added later.
    - open-iscsi
    - nfs-common
  write_files:
    - path: /etc/sysctl.d/90-k3s.conf
      permissions: "0644"
      content: |
        fs.inotify.max_user_instances = 8192
        fs.inotify.max_user_watches = 524288
    - path: /etc/rancher/k3s/config.yaml
      permissions: "0600"
      content: |
        write-kubeconfig-mode: "0600"
  runcmd:
    - [systemctl, enable, --now, qemu-guest-agent]
    - [sysctl, --system]
    - - sh
      - -c
      - >-
        curl -sfL https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh
        | INSTALL_K3S_VERSION='{{ k3s_version }}' sh -s - server
