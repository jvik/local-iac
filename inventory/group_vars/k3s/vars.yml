---
# Single-node k3s server for homelab workloads, installed by cloud-init on the first boot with the
# bundled Traefik, ServiceLB and local-path storage.
k3s_version: v1.36.5+k3s1

# Argo CD deploys every directory under apps/ in the workloads repository.
argocd_hostname: argocd.bitbu.dev
argocd_workloads_repo_url: git@github.com:jvik/homelab-workloads.git

# Public hostnames, served through a Cloudflare Tunnel to Traefik. Each needs an Ingress with the
# same host, in the workloads repository or kubernetes/apps.
cloudflare_tunnel_api_token: "{{ vault_cloudflare_api_token }}"
cloudflare_tunnel_zone: bitbu.dev
cloudflare_tunnel_hostnames:
  - hello.bitbu.dev
  - "{{ argocd_hostname }}"

# Hostnames that require a Cloudflare Access login first, and who may log in.
cloudflare_access_api_token: "{{ vault_cloudflare_api_token }}"
cloudflare_access_hostnames:
  - "{{ argocd_hostname }}"
cloudflare_access_emails: ["neat.bus1499@bitbu.no"]

# Created by the k3s_secrets role; manifests reference them by name.
k3s_secrets:
  - name: cloudflared
    namespace: cloudflared
    data:
      # Read from the Cloudflare API by the cloudflare_tunnel role.
      token: "{{ cloudflare_tunnel_token }}"
  # Read-only deploy key for the workloads repository. Argo CD picks up repository Secrets by label.
  - name: workloads-repo
    namespace: argocd
    labels:
      argocd.argoproj.io/secret-type: repository
    data:
      type: git
      url: "{{ argocd_workloads_repo_url }}"
      sshPrivateKey: "{{ vault_argocd_workloads_ssh_key }}"

proxmox_vm_image: ubuntu-26.04
proxmox_vm_cores: 4
proxmox_vm_memory: 8192
proxmox_vm_disk_size: 100G
proxmox_vm_tags: [k3s]

proxmox_vm_vendor_data:
  packages:
    - qemu-guest-agent
    # Needed by Longhorn and NFS volumes, if added later.
    - open-iscsi
    - nfs-common
  write_files:
    - path: /etc/sysctl.d/90-k3s.conf
      permissions: "0644"
      content: |
        fs.inotify.max_user_instances = 8192
        fs.inotify.max_user_watches = 524288
    - path: /etc/rancher/k3s/config.yaml
      permissions: "0600"
      content: |
        write-kubeconfig-mode: "0600"
  runcmd:
    - [systemctl, enable, --now, qemu-guest-agent]
    - [sysctl, --system]
    - - sh
      - -c
      - >-
        curl -sfL https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh
        | INSTALL_K3S_VERSION='{{ k3s_version }}' sh -s - server
