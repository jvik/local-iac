---
# =================================================================================================
# HARDWARE-SPECIFIC / ONE-OFF: pve01 (HP Z1 G8) disk layout as of 2026-10-21.
# Disk IDs are tied to the physical drives. Review and update this file before running against
# other hardware, after replacing a disk, or after reinstalling the host.
# =================================================================================================
# NVMe (954 GB) + A400 (894 GB) mirror: usable size is the smaller disk. Replace the A400 with a
# disk of at least 960 GB later and the pool grows (autoexpand).
proxmox_zfs_pools:
  - name: tank
    # zpool create refuses a mirror of different-sized disks without -f.
    force: true
    vdevs:
      - type: mirror
        disks:
          - /dev/disk/by-id/nvme-SAMSUNG_MZVL21T0HCLR-00BH1_S641NX0RC24624
          - /dev/disk/by-id/ata-KINGSTON_SA400S37960G_50026B7380C5ADD3
    storage:
      content: [images, rootdir]
      sparse: true

# ONE-OFF MIGRATION (done 2026-10-21): the installer-created, empty LVM storages that were on these
# disks. Now a no-op; kept so a reinstall replays the same migration. Delete once no longer needed.
proxmox_zfs_retired_lvm:
  - storage: lvm-01
    vg: lvm-01
    pvs: [/dev/disk/by-id/nvme-SAMSUNG_MZVL21T0HCLR-00BH1_S641NX0RC24624]
  - storage: lvm-02
    vg: lvm-02
    pvs: [/dev/disk/by-id/ata-KINGSTON_SA400S37960G_50026B7380C5ADD3]

# Single NIC on a switch trunk: VLAN 10 (management, 10.0.10.0/24) untagged, VLAN 50 (servers,
# 10.0.50.0/24, gw 10.0.50.1, DHCP with reservations) tagged. The host has no IP on VLAN 50; guests
# attach to the "servers" VNet. The tagged VLANs on vmbr0 are the VNet tags.
proxmox_network_bridges:
  - name: vmbr0
    ports: [nic0]
    address: 10.0.10.233/24
    gateway: 10.0.10.1
    vlan_aware: true
    vids: "{{ proxmox_sdn_vnets | map(attribute='tag') | list }}"

# No subnets: the router does DHCP for 10.0.50.0/24.
proxmox_sdn_zones:
  - id: lan
    type: vlan
    bridge: vmbr0

proxmox_sdn_vnets:
  - id: servers
    zone: lan
    tag: 50
    alias: Servers 10.0.50.0/24
